name: roam_and_rate
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0-278.1.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_slidable: ^3.1.1
  dropdown_search: ^6.0.2
  path: ^1.8.3
  shared_preferences: ^2.5.3
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  uuid: ^4.5.1
  currency_picker: ^2.0.21
  super_tooltip: ^2.1.0
  image_picker: ^1.1.2
  fl_chart: ^1.1.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.13.0
  build_runner: ^2.4.6

flutter:
  uses-material-design:
    true
    # To add assets
  assets:
    # Logos
    - assets/images/logo/logopurple.png

    # Onboard
    - assets/images/onboarding/

    # Icons
    - assets/images/icons/
    # - assets/images/icons/next-date.png
    # - assets/images/icons/time-left.png
    # - assets/images/icons/direct-flight.png
    # - assets/images/icons/flag.png

  # Custom fonts
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900

    - family: AntonSC
      fonts:
        - asset: assets/fonts/AntonSC/AntonSC-Regular.ttf
